name: Fitu Build

# CI workflow: unit tests run on every push to main (tests only) and gate every build: if tests fail, the workflow fails and no APK is built.
# If tests fail, the whole workflow fails and no APK is built.
# Optionally override the app version via the workflow inputs.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version to set, e.g. 2.5.0 (leave empty = keep current)'
        required: false
        default: ''
        type: string
      version_code:
        description: 'Version code (leave empty = auto-use the build number)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Show Run Info
      run: |
        echo "🏃 Run number: ${{ github.run_number }}"
        echo "📦 Commit: ${{ github.sha }}"

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Delete Old Artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const artifacts = await github.rest.actions.listArtifactsForRepo({ 
            owner, 
            repo, 
            per_page: 100 
          });
          const toDelete = artifacts.data.artifacts
            .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
            .slice(2);
          
          for (const artifact of toDelete) {
            try { 
              await github.rest.actions.deleteArtifact({ 
                owner, 
                repo, 
                artifact_id: artifact.id 
              });
              console.log(`✅ Deleted artifact: ${artifact.name}`);
            } catch (e) { 
              console.log(`❌ Failed to delete ${artifact.name}: ${e.message}`); 
            }
          }

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Validate Gradle Wrapper
      uses: gradle/wrapper-validation-action@v2

    - name: Set App Version (optional override)
      env:
        APP_VERSION: ${{ inputs.app_version }}
        NEW_VERSION_CODE: ${{ inputs.version_code }}
      run: |
        if [ -z "$APP_VERSION" ]; then
          echo "No version override provided - keeping the version from build.gradle.kts"
          exit 0
        fi
        if ! echo "$APP_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::Invalid version '$APP_VERSION' - use format like 2.5.0"
          exit 1
        fi
        CODE="${NEW_VERSION_CODE:-$GITHUB_RUN_NUMBER}"
        if ! echo "$CODE" | grep -qE '^[0-9]+$'; then
          echo "::error::Invalid version code '$CODE' - numbers only"
          exit 1
        fi
        sed -i "s/versionName = \".*\"/versionName = \"$APP_VERSION\"/" app/build.gradle.kts
        sed -i "s/versionCode = [0-9]*/versionCode = $CODE/" app/build.gradle.kts
        echo "App version set to $APP_VERSION (code: $CODE)"
        grep -nE 'versionName|versionCode' app/build.gradle.kts

    - name: Run Unit Tests (quality gate - workflow fails if these fail)
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: Run Lint (advisory)
      continue-on-error: true
      run: ./gradlew lintDebug --stacktrace

    - name: Get Version Name
      id: version
      run: |
        VERSION_NAME=$(grep -E 'versionName.*=.*"' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/' | head -n 1)
        VERSION_CODE=$(grep -E 'versionCode.*=.*[0-9]' app/build.gradle.kts | sed -E 's/.*= *([0-9]+).*/\1/' | head -n 1)
        
        if [ -z "$VERSION_NAME" ]; then
          VERSION_NAME="1.0.0"
        fi
        if [ -z "$VERSION_CODE" ]; then
          VERSION_CODE="1"
        fi
        
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "📱 App Version: $VERSION_NAME ($VERSION_CODE)"

    - name: Decode Keystore
      if: github.event_name == 'workflow_dispatch'
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
        echo "✅ Keystore decoded successfully"

    - name: Build Release APK
      if: github.event_name == 'workflow_dispatch'
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease --parallel --build-cache --stacktrace
        echo "📦 Release APK built successfully"

    - name: Get Build Info
      if: github.event_name == 'workflow_dispatch'
      id: build_info
      run: |
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
        echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
        echo "build_date=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

    - name: Create Release and Upload APK
      if: github.event_name == 'workflow_dispatch'
      uses: ncipollo/release-action@v1
      with:
        tag: "v${{ steps.version.outputs.version_name }}-${{ github.run_number }}"
        name: "Fitu v${{ steps.version.outputs.version_name }} (Build ${{ github.run_number }})"
        body: |
          ## 🎉 Fitu Release Build
          
          **Version:** ${{ steps.version.outputs.version_name }} (Code: ${{ steps.version.outputs.version_code }})
          **Build Date:** ${{ steps.build_info.outputs.build_date }}
          **APK Size:** ${{ steps.build_info.outputs.apk_size }}
          **Build Number:** ${{ github.run_number }}
          **Commit:** ${{ github.sha }}
          
          ### 📥 Installation
          Download the APK below and install on your Android device.
          
          > **Note:** You may need to enable "Install from Unknown Sources" in your device settings.
          
          ### 🔧 Build Type
          - Release APK (Signed)
        artifacts: "app/build/outputs/apk/release/*.apk"
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        makeLatest: true

    - name: Upload Room Schemas (for future migrations)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: room-schemas-${{ github.run_number }}
        path: app/schemas/
        retention-days: 7
        if-no-files-found: ignore

    - name: Cleanup
      if: always()
      run: |
        rm -f app/release-keystore.jks
        echo "🧹 Cleanup completed"

    - name: Build Summary
      if: success()
      run: |
        echo "## ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Type:** Release APK (Signed)" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ steps.version.outputs.version_name }} (Code: ${{ steps.version.outputs.version_code }})" >> $GITHUB_STEP_SUMMARY
        echo "**Build Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
