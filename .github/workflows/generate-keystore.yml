name: Generate Release Keystore (ONE-TIME)

on:
  workflow_dispatch:
    inputs:
      your_name:
        description: 'Your name (for the certificate)'
        required: true
        type: string

# SECURITY: The keystore password is read from the repository SECRET
# KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions).
# It is NEVER typed as a workflow input, because inputs appear in
# plain text in the workflow run log.

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - name: Check Password Secret Exists
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        if [ -z "$KEYSTORE_PASSWORD" ]; then
          echo "::error::Secret KEYSTORE_PASSWORD is not set."
          echo "Add it first: Settings > Secrets and variables > Actions > New repository secret"
          exit 1
        fi
        echo "Password secret found (value hidden by GitHub)"

    - name: Generate Keystore
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        keytool -genkey -v \
          -keystore fitu-release-key.jks \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -alias fitu \
          -storepass "$KEYSTORE_PASSWORD" \
          -keypass "$KEYSTORE_PASSWORD" \
          -dname "CN=${{ inputs.your_name }}, OU=Fitu, O=Fitu, L=Unknown, ST=Unknown, C=US"

    - name: Upload Keystore (DOWNLOAD & BACKUP!)
      uses: actions/upload-artifact@v4
      with:
        name: fitu-keystore-BACKUP-THIS
        path: fitu-release-key.jks
        retention-days: 1

    - name: How to Create the KEYSTORE_BASE64 Secret
      run: |
        echo "1. Download the keystore artifact above and back it up safely."
        echo "2. Create the base64 string locally and copy it to the clipboard:"
        echo "   Linux/Mac/Git-Bash:   base64 -w 0 fitu-release-key.jks"
        echo '   Windows PowerShell:   [Convert]::ToBase64String([IO.File]::ReadAllBytes("fitu-release-key.jks")) | Set-Clipboard'
        echo "3. Paste it into the repo secret KEYSTORE_BASE64."
        echo "The keystore is intentionally NOT printed in this log."

    - name: Cleanup
      if: always()
      run: rm -f fitu-release-key.jks